# docker-compose for local development.
#
#   postgres       — used by `make dev` and the running service  (port 5432)
#   postgres_test  — used by the integration / component tests (port 5433)
#   pgweb          — Postgres admin UI, single binary                (port 8081)
#
# Bring everything up:
#   docker compose up -d
#   make dev
#   open http://localhost:8080      # service
#   open http://localhost:8081      # pgweb (auto-connected to `postgres`)
#
# Tear everything down (drops the data volume):
#   docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: simple-gin-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simple_gin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simple_gin"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres_test:
    image: postgres:16-alpine
    container_name: simple-gin-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simple_gin_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simple_gin_test -p 5432"]
      interval: 2s
      timeout: 3s
      retries: 30

  pgweb:
    image: ghcr.io/sosedoff/pgweb:latest
    container_name: simple-gin-pgweb
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGWEB_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/simple_gin?sslmode=disable"
      PGWEB_LISTEN_ADDR: "0.0.0.0:8081"
      PGWEB_DISABLE_PSQL: "true"   # run queries from the browser, not psql shell
    ports:
      - "8081:8081"

volumes:
  pgdata:
